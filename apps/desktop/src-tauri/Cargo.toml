[package]
name = "linkpilot-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LinkPilot desktop app — Tauri shell hosting the daemon, tray, and config UI."

[features]
# Cargo owns private window API selection. Keep it out of Tauri's automatic
# dependency-feature rewriting so plain cargo check and Store builds both work.
default = ["direct-distribution"]
direct-distribution = ["tauri/macos-private-api", "dep:window-vibrancy"]
app-store = ["linkpilot-platform-mac/app-store"]

[lib]
name = "linkpilot_desktop"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "linkpilot-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
linkpilot-core = { workspace = true }
linkpilot-ipc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
linkpilot-platform-mac = { workspace = true }
# Translucent + frosted-glass background for the picker window.
window-vibrancy = { version = "0.6", optional = true }
# Raw NSWindow message sends for the picker — sets the collection
# behavior so the window can float over a full-screen Space, and
# raises the level above floating apps.
objc2 = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
linkpilot-platform-win = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
linkpilot-platform-linux = { workspace = true }
