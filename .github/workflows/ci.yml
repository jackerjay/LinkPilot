name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - claude/elegant-nash-381d81

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude linkpilot-desktop --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude linkpilot-desktop

      - name: Check desktop crate
        run: cargo check -p linkpilot-desktop

      - name: Test profile permission errors
        run: cargo test -p linkpilot-desktop profile_scan_

      - name: Test App Store policy
        env:
          TAURI_CONFIG: '{"app":{"macOSPrivateApi":false,"security":{"capabilities":["store"]}}}'
        run: cargo test --locked -p linkpilot-desktop --no-default-features --features app-store

      - name: Test App Store native bridge
        run: cargo test --locked -p linkpilot-platform-mac --features app-store store::tests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript binary
        run: corepack yarn run tsc --version

      - name: Build frontend
        run: corepack yarn run build

      - name: Build App Store frontend
        env:
          VITE_DISTRIBUTION: app-store
        run: corepack yarn run build --outDir dist-store

      - name: Test profile permission recovery
        run: corepack yarn run test:profile-access

      - name: Test notarization failure handling
        run: corepack yarn run test:notarize:mac

      - name: Test App Store signing profile validation
        run: python3 -m unittest discover -s scripts -p 'test_package_store.py'

  desktop-bundle:
    name: Desktop bundle smoke test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-bundle-smoke

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Test local signing order
        working-directory: apps/desktop
        run: corepack yarn run test:bundle:mac

      # Builds the .app bundle only (skips DMG packaging) in debug mode
      # so the Tauri bundling pipeline — icons, Info.plist, capabilities,
      # frontend assets — gets exercised on every PR without paying the
      # full release-build cost.
      - name: Build Tauri .app (debug)
        working-directory: apps/desktop
        run: corepack yarn run tauri build --debug --bundles app

      - name: Build App Store .app (debug)
        working-directory: apps/desktop
        env:
          VITE_DISTRIBUTION: app-store
        run: npm exec -- tauri build --debug --bundles app --no-sign --config src-tauri/tauri.store.conf.json --features app-store -- --no-default-features --locked

      - name: Verify sandbox bundle
        run: |
          bash apps/desktop/scripts/patch-info-plist.sh 'target/debug/bundle/macos/LinkPilot Store.app'
          codesign --force --sign - --entitlements apps/desktop/src-tauri/Entitlements.store.plist 'target/debug/bundle/macos/LinkPilot Store.app'
          codesign --verify --deep --strict 'target/debug/bundle/macos/LinkPilot Store.app'
